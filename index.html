<script>
const PAGES=[["THE FOREST", "OF LIFE", "Alexander Scot McPhie", "CONDENSED NARRATIVE · PRIVATE REVIEW"], ["The Forest of Life", "Alexander Scot McPhie", "A shortened narrative for author review", "Based on the supplied 2016 novel", "Private practice edition · Not for publication", "THE FOREST OF LIFE · STORY EDITION                                              2"], ["Earth. She had grown up in the Moon's ordered colonies, where", "the air was clean and every movement was carefully managed.", "Earth was something else: a dark, cloud-bound world crowded", "with billions of people. She had come to Brisbane to begin a new", "job and, more importantly, to begin a life of her own.", "The shuttle landed through threatening weather. On the ground,", "heat and humidity wrapped around her. She watched people rush", "through the aerospaceport, surrounded by talking computers,", "facial-recognition systems and machines that seemed to know", "her before she spoke. Michelle disliked the intrusion. She wanted", "to discover Earth for herself, not through the voice of her digital", "assistant, a 'Betty.'", "Outside the cities, there was little to discover. The living world", "had almost disappeared. Giant Rebreather towers kept the air", "breathable and tried to control the weather. Between the densely", "inhabited urban areas stretched dead land. Michelle knew the", "facts, but facts were not the same as seeing a planet whose", "forests were nearly gone.", "THE FOREST OF LIFE · STORY EDITION                                              3"], ["into Brisbane's crowded streets. Every surface seemed occupied", "by advertising, technology or people. Food was plentiful, yet it", "came from Organoprocessors rather than farms. The world had", "built extraordinary systems to keep humanity alive after the", "collapse of natural ecosystems.", "She began work at Sysdene, a company delivering public", "services and managing government housing. There she", "encountered the endless arithmetic of budgets, complaints,", "maintenance orders and people who needed help. She had hoped", "a new world would mean freedom. Instead, she found another set", "of rules, and a great many people who accepted those rules", "without asking why.", "At work she noticed a technician named Matthew Finler. He", "seemed intelligent, distracted and unwilling to pretend that his", "job mattered to him. He offered to help her with technical", "problems, but there was something else in the way he spoke: a", "restless dissatisfaction with the world that everyone else", "appeared to take for granted.", "THE FOREST OF LIFE · STORY EDITION                                              4"], ["software and the strange digital assistants that ran much of", "society. Yet he had grown tired of fixing one system after another", "without questioning the larger machine they served.", "When Michelle learned that he was leaving his position, she was", "surprised. He did not have a secure new career waiting. He had", "some freelance work and enough savings to think for a while.", "That seemed reckless to her. To Matthew, remaining in a job he", "no longer believed in seemed worse.", "They talked over lunch. Michelle was drawn to his curiosity,", "although she could not understand why he made life so difficult", "for himself. Matthew liked her directness and the fact that she", "had chosen to come to Earth despite its troubles. Their", "conversation was ordinary, but it left them both wanting another.", "Soon, the distance between a passing acquaintance and someone", "important began to narrow.", "THE FOREST OF LIFE · STORY EDITION                                              5"], ["had spread through connected ecosystems, through soil and", "water, crops and forests, until the failure of one living process", "pushed another toward ruin. Technology had advanced at the", "same time. Disease could be treated, distant colonies", "established, and digital systems made ever more powerful. None", "of those achievements had stopped the loss of life beneath", "humanity's feet.", "Now the cities relied on Organoprocessors to manufacture food", "and other organic goods. Rebreathers handled the air.", "Governments and corporations controlled the systems on which", "everyone depended. Outside the protected zones, the land was", "largely lifeless.", "Michelle was learning to live inside that arrangement. Matthew", "could not stop wondering how it had happened, or whether the", "answer was being hidden. For him, the question was not simply", "how to keep people alive today. It was what kind of future they", "could have if the last living systems continued to be consumed.", "THE FOREST OF LIFE · STORY EDITION                                              6"], ["installation linked to the industrial empire of Douglas Orschlack.", "The assignment seemed straightforward: diagnose a malfunction", "in an important data system. The site was heavily controlled, and", "its staff were unusually cautious about what he might see.", "With the help of his digital assistant, Chrissie, Matthew traced", "the problem to unusual biological storage components. The", "equipment used living material in a way that made him uneasy. A", "suspected contamination and a hidden history of the storage", "system raised more questions than the repair order answered.", "He completed the technical work, but he did not forget what he", "had found. Orschlack's name was associated with the", "technologies that sustained civilization. If those technologies", "depended on something living, then the world's most celebrated", "solution might have a weakness no one wanted to admit.", "Matthew began to investigate quietly. His curiosity, once a vague", "rebellion against ordinary work, had acquired a dangerous", "direction.", "THE FOREST OF LIFE · STORY EDITION                                              7"], ["invited her to an old film, and she invited him to dinner. Their", "awkward conversations gave way to laughter, affection and a", "growing intimacy. Michelle loved the way he could be fascinated", "by a simple question; Matthew loved her warmth and her", "determination to make a life far from home.", "But their differences remained. Michelle believed in work, plans", "and commitments. Matthew was searching for an idea large", "enough to justify changing his life. She wanted to know where", "they were going together. He struggled to explain where he was", "going alone.", "The city around them continued to run on artificial food,", "managed weather and machines that listened. Their private", "happiness seemed possible inside that world, but Matthew could", "not put aside the feeling that the world itself was wrong.", "Michelle sometimes wished he could simply be happy with what", "they had.", "THE FOREST OF LIFE · STORY EDITION                                              8"], ["question Matthew had been avoiding: did he love her? She knew", "her own answer. She loved him deeply. Matthew hesitated,", "tangled in feelings he had never properly understood and", "memories of another attachment.", "His uncertainty hurt Michelle. For a time, they tried to work", "through it. She wanted honesty and a future she could recognize.", "He wanted to be truthful without promising something he feared", "he could not sustain. Neither could easily separate love from the", "demands each placed upon it.", "Their arguments were not only about romance. Michelle wanted", "Matthew to act on his ideas instead of surrounding himself with", "notes and possibilities. Matthew believed that the world needed", "a more fundamental change than a stable job and a conventional", "life could offer.", "Even when they drew close again, the difference between their", "hopes waited beneath the surface.", "THE FOREST OF LIFE · STORY EDITION                                              9"], ["different answer: the Wilderness Area, a protected region where", "plants and animals still survived. Its boundaries were guarded,", "its interior inaccessible to ordinary people. Most citizens could", "see it only through controlled images or from expensive viewing", "platforms.", "For Matthew, the Wilderness Area became more than a symbol.", "He suspected that Orschlack's Organoprocessors were not", "creating life from nothing. Their biological systems might require", "living cells that had to come from somewhere. The surviving", "wilderness offered a possible source.", "If he was right, the public had been told an incomplete story", "about the technology that fed them. The forest might not be", "protected from exploitation at all. It might be the source of a", "hidden extraction industry.", "Michelle understood the danger of pursuing such a suspicion.", "Matthew saw the danger of refusing to ask.", "THE FOREST OF LIFE · STORY EDITION                                             10"], ["busy institutional world of Sysdene, meeting colleagues and", "taking on responsibilities. Matthew moved in the opposite", "direction, spending more time alone with his research, his", "theories and Chrissie's calculations.", "The more he spoke about a different society, the more Michelle", "wondered whether there was room for her in it. He questioned", "money, corporate power and a world where people could obtain", "the necessities of life only by participating in systems they did", "not control. She did not dismiss all his concerns, but she needed", "a partner who could live in the present.", "Their affection could not settle the disagreement. Michelle told", "him they wanted different things. Matthew argued that two", "people could follow their own paths and still meet in the middle.", "She was no longer sure such a middle existed.", "They separated, painfully and without the certainty that either", "had stopped caring.", "THE FOREST OF LIFE · STORY EDITION                                             11"], ["harder than he expected. He watched her continue with work", "and friendships while his own life seemed to shrink around a", "single absence. At times he reached out, apologizing, insisting", "that love mattered more than his theories. Michelle listened, but", "she could not keep reopening the same wound.", "Other people entered her life, and she attempted to move", "forward. Yet Matthew remained part of her thoughts. She knew", "his flaws and knew, too, that he had a kind of sincerity she had", "rarely found elsewhere.", "Matthew's investigation continued alongside his grief. The", "biological systems inside Organoprocessors appeared to depend", "on existing living processes. He came to believe that the official", "account of manufactured food concealed a growing shortage.", "What if humanity was consuming not only the visible forests of", "the past, but the last microscopic ecosystems on which its future", "depended?", "THE FOREST OF LIFE · STORY EDITION                                             12"], ["Organoprocessors did not simply assemble meals out of inert", "elements. Their operation depended on living cellular processes,", "manipulated and redirected into the production of food and other", "materials.", "This mattered because living systems could be depleted. If the", "supply of viable cells failed, a world that had forgotten", "agriculture might lose the very machines it trusted to replace", "nature. Matthew suspected that powerful people understood the", "problem and had chosen secrecy instead of change.", "He considered the surviving Wilderness Area. Its diversity was", "unlike anything left outside its walls. It could sustain a supply of", "biological material for industrial use—but only if somebody was", "taking that material. Such activity would be hidden from the", "citizens who believed the area was being preserved.", "The idea seemed almost impossible to prove. Matthew decided", "that proof, not another argument, was what he needed.", "THE FOREST OF LIFE · STORY EDITION                                             13"], ["restricted and watched. He planned carefully, relying on Chrissie", "to help him understand the surveillance systems without drawing", "attention to himself.", "Before leaving, he went to Michelle. She was weary of his", "explanations and afraid he was once again chasing an idea that", "would consume him. When he told her he meant to go into the", "protected wilderness, she was horrified.", "He insisted that he was not asking her to follow him. He wanted", "her to know where he was going. But the danger, the secrecy and", "the possibility of never seeing him again changed the", "conversation. Despite their broken relationship, Michelle could", "not simply turn away.", "Eventually they traveled together toward the Wilderness Area.", "Whatever remained unresolved between them, they were now", "approaching a place neither had truly experienced: a living forest", "in a world that had almost forgotten what one was.", "THE FOREST OF LIFE · STORY EDITION                                             14"], ["the Wilderness Area. From its viewing platforms, visitors could", "glimpse vegetation and mountains beyond the boundary. The", "contrast was extraordinary. Behind them lay the managed,", "brown landscape of civilization. Ahead was green life.", "Matthew kept his plans quiet. He distrusted the digital systems", "in the building and worried that even an apparently private room", "might be monitored. Michelle was excited by the view but uneasy", "about the secrecy.", "They moved from the safe, expensive perspective offered to", "tourists toward a hidden route beneath the boundary. With", "improvised tools and Chrissie's assistance, Matthew found a way", "through a drainage passage. The crossing was awkward and", "dangerous, but they emerged on the other side.", "For the first time, Michelle stood among living plants and heard", "the sounds of animals without a screen or recording between", "them. The forest was not a display. It was a world of its own.", "THE FOREST OF LIFE · STORY EDITION                                             15"], ["The forest changed with altitude and terrain. Insects moved", "through the leaf litter; birds called above them. Michelle saw", "things she had known only from books and documentaries. Some", "frightened her. Others filled her with wonder.", "Matthew was overwhelmed by the variety of life. The forest", "seemed to offer a glimpse of what the planet had once been. But", "it also raised a painful question: if so much life still existed here,", "why was the rest of Earth being allowed to die?", "They saw a wasp dragging a paralyzed spider and argued gently", "about cruelty and nature. Matthew said the creature was doing", "what came naturally. Michelle could understand that and still", "feel sorry for the spider.", "They camped in the wilderness, sharing food and listening to the", "night. Their old differences did not vanish, but they were no", "longer speaking only about themselves. They were discovering", "the same place together.", "THE FOREST OF LIFE · STORY EDITION                                             16"], ["within the protected area. He knew that surveillance technology", "might detect a direct attempt to control sophisticated systems, so", "he avoided drawing on Chrissie's full capabilities. The wilderness", "was enormous, and his clues were incomplete.", "They climbed ridges, followed streams and searched for signs", "that people had been working where no one was supposed to be.", "Michelle questioned the practicalities. Without a proper map,", "how would they find their way back? Without reliable", "communications, how could they call for help?", "Matthew believed he could retrace their route. His confidence", "was not always convincing. Still, the journey gave them moments", "of beauty that neither wanted to surrender. The forests grew", "denser. They reached views of valleys, cliffs and water that", "seemed impossible beside the exhausted cities beyond the wall.", "The farther they traveled, the greater the risk of being lost—and", "of finding exactly what Matthew feared.", "THE FOREST OF LIFE · STORY EDITION                                             17"], ["kept him restless for so long. He believed society had made", "nearly everything into a commodity, forcing people to buy access", "to the things that once grew freely. Money and corporate power", "had become the measures of survival, while the living systems", "that made survival possible had been destroyed.", "Michelle listened, sometimes challenging him. She had seen the", "benefits of order, technology and work. She did not think all of", "those things were wrong. Yet the forest made his argument", "harder to dismiss. Here was life sustained through relationships", "more complex than any market calculation.", "For Matthew, the wilderness suggested that a society built", "around shared needs rather than endless extraction might be", "possible. For Michelle, it suggested something simpler and more", "immediate: that life was precious, fragile and impossible to", "replace with a simulation.", "Their conversation did not settle the world's future. It brought", "them closer to understanding each other.", "THE FOREST OF LIFE · STORY EDITION                                             18"], ["delighted them. They swam in the cold water, laughed as the", "falling spray struck their skin and enjoyed a moment free from", "the pressure of the outside world.", "Michelle looked at Matthew with affection. She wondered aloud", "why she had met someone so strange and difficult. Then she", "admitted that she was glad she had. Matthew felt the possibility", "of a future between them but was afraid to speak too quickly and", "spoil it.", "For a brief time, the journey seemed to offer everything they had", "lost: trust, tenderness and a world worth sharing. The forest was", "no longer only evidence in Matthew's investigation. It was a", "place where the two of them could simply be alive.", "Then Michelle noticed something beyond the vegetation: the", "edge of a building, partly hidden among the trees. The discovery", "brought Matthew's suspicions suddenly close to reality.", "THE FOREST OF LIFE · STORY EDITION                                             19"], ["Michelle screamed. A brown snake had struck her leg, then", "struck again. Matthew turned and attacked the snake with a", "rock, but the damage had already been done.", "Michelle weakened rapidly. Matthew knew the bite was serious", "and struggled to decide what to do. They were deep inside the", "forbidden wilderness, far from ordinary medical help. The", "beautiful isolation that had thrilled them now became a trap.", "He carried her toward the building they had seen, hoping to find", "someone with medicine or a way to summon assistance. His fear", "was no longer about being discovered. It was about losing", "Michelle before he could help her.", "The building, which had seemed like the proof he needed,", "became his only hope of saving the person he loved.", "THE FOREST OF LIFE · STORY EDITION                                             20"], ["within the Wilderness Area: trees being cut, animals taken and", "resources extracted. The evidence he had been searching for was", "in front of him.", "An older man turned from the monitors. It was Douglas", "Orschlack, the powerful figure behind the Organoprocessors.", "Orschlack already knew Matthew's name. He admitted that", "Matthew had been watched and that the hidden activity was real.", "Matthew begged him to help Michelle. Orschlack said there was", "no antivenin available and that it was too late. He spoke of her", "death with a coldness Matthew could scarcely bear.", "Then Orschlack explained the deeper crisis. Organoprocessors", "relied on living cellular ecosystems, and those systems were", "dying too. The wider ecocide had never truly stopped. The", "machinery feeding humanity was consuming the very biological", "foundations it needed to survive.", "Matthew had found his answer. It came at the worst possible", "cost.", "THE FOREST OF LIFE · STORY EDITION                                             21"], ["the building and the people guarding it, carrying the shock of", "what had happened to Michelle. Pursuers came after him with a", "dog.", "The animal caught him and attacked, tearing his hand and", "injuring his leg. Matthew fought it off with a rock and staggered", "deeper into the forest. Blood soaked his improvised bandage. He", "was frightened, in pain and desperate to escape the men behind", "him.", "He pushed through trees and across uneven ground until the", "sounds of pursuit faded. But safety was only another kind of", "danger. He no longer knew where he was. The forest he had", "admired became a maze of slopes and gullies, and every", "movement made his injuries worse.", "He tried to follow the land downhill, hoping water would lead", "him toward an exit. The hours passed. Hunger, exhaustion and", "pain stripped away the confidence that had brought him there.", "THE FOREST OF LIFE · STORY EDITION                                             22"], ["pools, stumbled along a creek and fought to remain conscious.", "The forest was full of life, but it could not protect him from", "infection, blood loss or the cold. The same wilderness that had", "seemed like a promise now held him without offering an easy", "way out.", "He thought of Michelle. He remembered her warmth and the", "future they had almost found again. The moon above the trees", "brought her to mind with painful clarity.", "By the following day, his strength was failing. He fell, rose and", "fell again. At the edge of consciousness, he saw Michelle beside", "him, speaking gently and encouraging him onward. Whether this", "was memory, vision or something beyond his failing body, the", "moment gave him enough strength to try to stand.", "The novel ends with a brief, enigmatic scene involving Kim and a", "question about butterflies. It does not supply a conventional", "rescue or a simple explanation of everything that has happened.", "Its closing note remains deliberately unsettling, leaving the", "reader with life, loss and the fragile persistence of hope.", "THE FOREST OF LIFE · STORY EDITION                                             23"], ["1. What first motivates Michelle to leave the Moon and", "move to Earth?", "2. How does life in Brisbane reveal humanity’s dependence", "on technology?", "3. What makes Matthew dissatisfied with his work and the", "world around him?", "4. Why do Michelle and Matthew struggle to maintain their", "relationship?", "5. What does Matthew suspect about Organoprocessors and", "living cells?", "THE FOREST OF LIFE · STORY EDITION                                             24"], ["1. Why does the Wilderness Area matter to Matthew’s", "investigation?", "2. What changes when Michelle experiences real plants and", "animals?", "3. What does Orschlack reveal about the ecological crisis?", "4. How does the ending complicate the idea that nature is", "either safe or dangerous?", "5. What do you think the final scene with Kim and the", "butterflies suggests? Explain your interpretation.", "THE FOREST OF LIFE · STORY EDITION                                             25"]];

const $=id=>document.getElementById(id);let opened=false,index=0,busy=false;
const pageCount=PAGES.length;
function pageHTML(i){if(i<0||i>=pageCount)return '';const p=PAGES[i];return p.map(t=>'<p>'+escapeHTML(t)+'</p>').join('');}
function escapeHTML(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){ $('leftText').innerHTML=pageHTML(index);$('rightText').innerHTML=pageHTML(index+1);$('leftFolio').textContent=index<pageCount?index+1:'';$('rightFolio').textContent=index+1<pageCount?index+2:''; $('prev').disabled=!opened||busy||index===0;$('next').disabled=!opened||busy||index+2>=pageCount;$('toggle').textContent=opened?'Close book':'Open book';$('status').textContent=opened?`Reading pages ${index+1}–${Math.min(index+2,pageCount)} of ${pageCount}`:'Closed hardcover';}
function toggleBook(){if(busy)return;opened=!opened;$('holder').classList.toggle('open',opened);render();}
function turn(direction){if(!opened||busy)return;const nextIndex=index+direction*2;if(nextIndex<0||nextIndex>=pageCount)return;busy=true;render();const sheet=$('turnSheet');sheet.className='turn-sheet';$('turnFront').innerHTML=pageHTML(direction>0?index+1:index-1);$('turnBack').innerHTML=pageHTML(direction>0?index+2:index);void sheet.offsetWidth;sheet.classList.add('active');if(direction<0)sheet.classList.add('reverse');sheet.addEventListener('animationend',()=>{index=nextIndex;sheet.className='turn-sheet';busy=false;render()},{once:true});}
$('toggle').onclick=toggleBook;$('prev').onclick=()=>turn(-1);$('next').onclick=()=>turn(1);$('frontCover').onclick=toggleBook;$('frontCover').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleBook()}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});render();
</script></body></html>
