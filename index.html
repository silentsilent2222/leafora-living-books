
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leafora Living Books | Hardcover Prototype</title>
<style>
:root{--w:315px;--h:455px;--paper:#fff;--ink:#25221d;--hard:#e9e6df;--gold:#a28c67}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#f2e8da,#c7b6a4);color:#342e29;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden}
header{position:absolute;top:20px;left:0;width:100%;text-align:center;font:600 12px system-ui,sans-serif;letter-spacing:.24em;color:#685c4d}header small{display:block;margin-top:7px;font-size:10px;letter-spacing:.1em;font-weight:400}
.stage{width:min(100%,1040px);height:620px;position:relative;display:flex;justify-content:center;align-items:center;perspective:1800px;overflow:visible}
.ground{position:absolute;bottom:46px;width:690px;max-width:94%;height:45px;background:radial-gradient(ellipse,#4a382e55,transparent 68%);filter:blur(15px)}
.book{width:var(--w);height:var(--h);position:relative;transform-style:preserve-3d;transform:translateX(0) rotateX(5deg) rotateY(-9deg);transition:transform 1.4s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(17px 19px 15px #3d2c2066)}
.book.open{transform:translateX(calc(var(--w)/2)) rotateX(4deg) rotateY(0deg)}
/* Back board, real page-block edges and the white right-hand leaf */
.back-board{position:absolute;inset:-5px -7px -7px -8px;background:linear-gradient(90deg,#bbb7ad,#f3f0ea 5%,#dedbd4 96%,#a6a096);border:2px solid #b9b4ab;border-radius:5px 7px 8px 5px;box-shadow:inset -7px 0 8px #857e7044,9px 6px 0 #b0a89a;transform:translateZ(-19px)}
.page-block{position:absolute;inset:7px 3px 6px 8px;background:repeating-linear-gradient(to bottom,#fefefe 0 2px,#e7e3dc 2px 3px);border:1px solid #c9c4ba;border-radius:1px 5px 5px 1px;box-shadow:4px 1px 1px #a8a299,8px 3px 0 #d5cfc4,11px 5px 0 #a59f95;transform:translateZ(-5px)}
.right-page,.left-page{position:absolute;inset:9px 8px 8px 10px;background:var(--paper);color:var(--ink);padding:43px 33px 35px;overflow:hidden;box-shadow:inset 17px 0 22px -19px #3b342766;backface-visibility:hidden}
.right-page{transform:translateZ(3px)}.right-page h2,.left-page h2{font-size:23px;text-align:center;font-weight:400;line-height:1.3;margin:52px 0 20px}.right-page p,.left-page p{font-size:13px;line-height:1.8;text-align:justify}.right-page .page-num,.left-page .page-num{position:absolute;bottom:17px;left:0;width:100%;text-align:center;font-size:11px}
/* The actual front board rotates on the book's LEFT spine */
.front-board{position:absolute;inset:-6px -6px -6px -9px;transform-origin:0 50%;transform-style:preserve-3d;z-index:12;transition:transform 1.75s cubic-bezier(.2,.7,.17,1);cursor:pointer}
.book.open .front-board{transform:rotateY(-178deg)}
.cover-face,.cover-inside{position:absolute;inset:0;backface-visibility:hidden;border-radius:5px 7px 7px 4px;overflow:hidden}
.cover-face{background:linear-gradient(90deg,#c2beb5 0%,#efede8 5%,#f7f6f2 16%,#e9e7e1 100%);border:2px solid #c4c0b7;box-shadow:inset 6px 0 9px #6d675c55,inset -4px 0 7px #ffffffbb,5px 4px 1px #8e887d;transform:translateZ(5px);padding:29px 29px 27px 36px}
.cover-art{width:100%;height:100%;border:1px solid #607e79;background:linear-gradient(180deg,#a4d4dc 0%,#b2d5d0 26%,#4d7853 49%,#2b604b 53%,#7db1bc 55%,#23728e 100%);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;box-shadow:0 1px 2px #0004;overflow:hidden}
.cover-art:before{content:"";position:absolute;top:27%;left:-10%;width:120%;height:26%;background:radial-gradient(ellipse at 15% 80%,#386743 0 19%,transparent 20%),radial-gradient(ellipse at 40% 60%,#5c8b4d 0 22%,transparent 23%),radial-gradient(ellipse at 68% 80%,#466f3d 0 24%,transparent 25%),radial-gradient(ellipse at 95% 75%,#6b8e46 0 20%,transparent 21%);filter:blur(2px)}
.cover-art:after{content:"";position:absolute;top:56%;left:0;right:0;height:30%;background:linear-gradient(180deg,#316b6590,transparent 85%);transform:scaleY(-1);opacity:.55}
.cover-art .title{position:relative;z-index:2;color:#f9f0da;text-shadow:1px 2px 4px #102b25,0 0 15px #142e2b;font-size:31px;line-height:1.12;letter-spacing:.035em;text-transform:uppercase;margin-top:70px}.cover-art .author{position:absolute;bottom:25px;z-index:2;color:#142c2c;font-size:14px;letter-spacing:.24em;text-transform:uppercase}
.cover-inside{background:linear-gradient(90deg,#f6f4ee,#fff 20%,#faf9f5);border:3px solid #d2cfc7;transform:rotateY(180deg) translateZ(5px);box-shadow:inset -14px 0 20px -18px #0006}
.spine{position:absolute;left:-13px;top:-5px;height:calc(100% + 10px);width:18px;border-radius:8px 2px 2px 8px;background:linear-gradient(90deg,#8b867c,#c6c1b6 32%,#f1efe9 70%,#aaa49a);transform:rotateY(90deg) translateX(-1px);transform-origin:right center;box-shadow:0 0 3px #0005}
/* Separate real-looking leaf: it flips after opening the cover */
.turning-leaf{position:absolute;inset:9px 8px 8px 10px;transform-origin:left center;transform-style:preserve-3d;z-index:8;pointer-events:none;transition:transform 1.15s cubic-bezier(.3,.7,.3,1);visibility:hidden}
.book.open .turning-leaf{visibility:visible}.turning-leaf.flipped{transform:rotateY(-180deg)}
.leaf-front,.leaf-back{position:absolute;inset:0;background:white;backface-visibility:hidden;padding:40px 30px;box-shadow:inset 12px 0 20px -16px #0007,4px 2px 8px #0002}.leaf-back{transform:rotateY(180deg);box-shadow:inset -12px 0 20px -16px #0007}.leaf-front h2,.leaf-back h2{font-weight:400;font-size:21px;text-align:center;margin:70px 0 20px}.leaf-front p,.leaf-back p{font-size:13px;line-height:1.8}.leaf-back{background:#fff}
/* After opening, show the inside front board on the left, and the first leaf on the right */
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:-4px;z-index:30;padding:0 12px}.controls button{border:1px solid #82715e;background:#fffaf1;color:#3e332a;padding:12px 20px;border-radius:30px;cursor:pointer;font:600 13px system-ui,sans-serif}.controls button.primary{background:#413c32;color:#fff}.controls button:disabled{opacity:.35;cursor:not-allowed}.hint{text-align:center;max-width:520px;padding:0 18px;font:12px/1.5 system-ui,sans-serif;color:#615548;margin:15px auto 0}
@media(max-width:720px){:root{--w:215px;--h:315px}.stage{height:450px}.cover-face{padding:19px 17px 18px 23px}.cover-art .title{font-size:21px;margin-top:50px}.cover-art .author{font-size:9px}.right-page,.left-page,.leaf-front,.leaf-back{padding:21px 18px}.right-page h2,.left-page h2,.leaf-front h2,.leaf-back h2{font-size:15px;margin:35px 0 13px}.right-page p,.left-page p,.leaf-front p,.leaf-back p{font-size:10px;line-height:1.55}.book.open{transform:translateX(calc(var(--w)/2)) rotateX(4deg) rotateY(0deg)}.controls button{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){.book,.front-board,.turning-leaf{transition-duration:.01ms}}

/* Practice cover artwork supplied by user, not the novel's original cover */
.cover-art{background:#102c40!important}.cover-art:before,.cover-art:after{display:none!important}
.cover-art img{display:block;width:100%;height:100%;object-fit:fill}
.right-page,.leaf-front,.leaf-back{padding:24px 23px 25px!important}
.paper-copy{font-size:11.1px;line-height:1.53;text-align:left;overflow:hidden;height:100%;color:#24211d}
.paper-copy p{font-size:inherit!important;line-height:inherit!important;margin:0 0 9px!important;text-align:left!important}
.paper-copy .folio{position:absolute;bottom:9px;right:20px;font:10px Georgia,serif;color:#777}
.paper-copy h2{font:normal 20px Georgia,serif;margin:30px 0 16px!important;text-align:center}
.cover-inside{display:flex;align-items:center;justify-content:center}
.book.open .front-board{pointer-events:none}
.back-board{background:linear-gradient(90deg,#bbb7ad,#f3f0ea 5%,#dedbd4 96%,#a6a096)}

const book=document.getElementById('book'),leaf=document.getElementById('leaf'),coverBtn=document.getElementById('coverBtn'),turnBtn=document.getElementById('turnBtn'),hint=document.getElementById('hint');
const storyPages=[["From the window of her shuttle, Michelle Holland looked down at Earth. She had grown up in the Moon's ordered colonies, where the air was clean and every movement was carefully managed. Earth was something else: a dark, cloud-bound world crowded with billions of people. She had come to Brisbane to begin a new job and, more importantly, to begin a life of her own."], ["The shuttle landed through threatening weather. On the ground, heat and humidity wrapped around her. She watched people rush through the aerospaceport, surrounded by talking computers, facial-recognition systems and machines that seemed to know her before she spoke. Michelle disliked the intrusion. She wanted to discover Earth for herself, not through the voice of her digital assistant, a 'Betty.'"], ["Outside the cities, there was little to discover. The living world had almost disappeared. Giant Rebreather towers kept the air breathable and tried to control the weather. Between the densely inhabited urban areas stretched dead land. Michelle knew the facts, but facts were not the same as seeing a planet whose forests were nearly gone."], ["Michelle found temporary accommodation and made her way into Brisbane's crowded streets. Every surface seemed occupied by advertising, technology or people. Food was plentiful, yet it came from Organoprocessors rather than farms. The world had built extraordinary systems to keep humanity alive after the collapse of natural ecosystems."], ["She began work at Sysdene, a company delivering public services and managing government housing. There she encountered the endless arithmetic of budgets, complaints, maintenance orders and people who needed help. She had hoped a new world would mean freedom. Instead, she found another set of rules, and a great many people who accepted those rules without asking why."], ["At work she noticed a technician named Matthew Finler. He seemed intelligent, distracted and unwilling to pretend that his job mattered to him. He offered to help her with technical problems, but there was something else in the way he spoke: a restless dissatisfaction with the world that everyone else appeared to take for granted.", "Matthew was good at his work. He understood hardware, software and the strange digital assistants that ran much of society. Yet he had grown tired of fixing one system after another without questioning the larger machine they served."], ["When Michelle learned that he was leaving his position, she was surprised. He did not have a secure new career waiting. He had some freelance work and enough savings to think for a while. That seemed reckless to her. To Matthew, remaining in a job he no longer believed in seemed worse."], ["They talked over lunch. Michelle was drawn to his curiosity, although she could not understand why he made life so difficult for himself. Matthew liked her directness and the fact that she had chosen to come to Earth despite its troubles. Their conversation was ordinary, but it left them both wanting another. Soon, the distance between a passing acquaintance and someone important began to narrow."], ["Earth had not become barren in a single disaster. The collapse had spread through connected ecosystems, through soil and water, crops and forests, until the failure of one living process pushed another toward ruin. Technology had advanced at the same time. Disease could be treated, distant colonies established, and digital systems made ever more powerful. None of those achievements had stopped the loss of life beneath humanity's feet."], ["Now the cities relied on Organoprocessors to manufacture food and other organic goods. Rebreathers handled the air. Governments and corporations controlled the systems on which everyone depended. Outside the protected zones, the land was largely lifeless.", "Michelle was learning to live inside that arrangement. Matthew could not stop wondering how it had happened, or whether the answer was being hidden. For him, the question was not simply how to keep people alive today. It was what kind of future they could have if the last living systems continued to be consumed."], ["Freelance work brought Matthew to an Organoprocessor installation linked to the industrial empire of Douglas Orschlack. The assignment seemed straightforward: diagnose a malfunction in an important data system. The site was heavily controlled, and its staff were unusually cautious about what he might see.", "With the help of his digital assistant, Chrissie, Matthew traced the problem to unusual biological storage components. The equipment used living material in a way that made him uneasy. A suspected contamination and a hidden history of the storage system raised more questions than the repair order answered."], ["He completed the technical work, but he did not forget what he had found. Orschlack's name was associated with the technologies that sustained civilization. If those technologies depended on something living, then the world's most celebrated solution might have a weakness no one wanted to admit.", "Matthew began to investigate quietly. His curiosity, once a vague rebellion against ordinary work, had acquired a dangerous direction."], ["What disturbed him most was the trace of King Parrot DNA in the bacterial memory drives. King Parrots were supposed to be extinct. The trace suggested a connection between the industrial machinery and living creatures the world had been told were gone.", "Michelle and Matthew kept finding reasons to see each other. He invited her to an old film, and she invited him to dinner. Their awkward conversations gave way to laughter, affection and a growing intimacy. Michelle loved the way he could be fascinated by a simple question; Matthew loved her warmth and her determination to make a life far from home."], ["But their differences remained. Michelle believed in work, plans and commitments. Matthew was searching for an idea large enough to justify changing his life. She wanted to know where they were going together. He struggled to explain where he was going alone.", "The city around them continued to run on artificial food, managed weather and machines that listened. Their private happiness seemed possible inside that world, but Matthew could not put aside the feeling that the world itself was wrong. Michelle sometimes wished he could simply be happy with what they had."], ["The relationship grew intense, and Michelle finally asked the question Matthew had been avoiding: did he love her? She knew her own answer. She loved him deeply. Matthew hesitated, tangled in feelings he had never properly understood and memories of another attachment.", "His uncertainty hurt Michelle. For a time, they tried to work through it. She wanted honesty and a future she could recognize. He wanted to be truthful without promising something he feared he could not sustain. Neither could easily separate love from the demands each placed upon it."], ["Their arguments were not only about romance. Michelle wanted Matthew to act on his ideas instead of surrounding himself with notes and possibilities. Matthew believed that the world needed a more fundamental change than a stable job and a conventional life could offer.", "Even when they drew close again, the difference between their hopes waited beneath the surface."], ["There was one place on Earth that held the possibility of a different answer: the Wilderness Area, a protected region where plants and animals still survived. Its boundaries were guarded, its interior inaccessible to ordinary people. Most citizens could see it only through controlled images or from expensive viewing platforms.", "For Matthew, the Wilderness Area became more than a symbol. He suspected that Orschlack's Organoprocessors were not creating life from nothing. Their biological systems might require living cells that had to come from somewhere. The surviving wilderness offered a possible source."], ["If he was right, the public had been told an incomplete story about the technology that fed them. The forest might not be protected from exploitation at all. It might be the source of a hidden extraction industry.", "Michelle understood the danger of pursuing such a suspicion. Matthew saw the danger of refusing to ask.", "Michelle's career advanced. She became more confident in the busy institutional world of Sysdene, meeting colleagues and taking on responsibilities. Matthew moved in the opposite direction, spending more time alone with his research, his theories and Chrissie's calculations."], ["The more he spoke about a different society, the more Michelle wondered whether there was room for her in it. He questioned money, corporate power and a world where people could obtain the necessities of life only by participating in systems they did not control. She did not dismiss all his concerns, but she needed a partner who could live in the present.", "Their affection could not settle the disagreement. Michelle told him they wanted different things. Matthew argued that two people could follow their own paths and still meet in the middle. She was no longer sure such a middle existed."], ["They separated, painfully and without the certainty that either had stopped caring.", "Matthew tried to accept Michelle's request for distance. It was harder than he expected. He watched her continue with work and friendships while his own life seemed to shrink around a single absence. At times he reached out, apologizing, insisting that love mattered more than his theories. Michelle listened, but she could not keep reopening the same wound.", "Other people entered her life, and she attempted to move forward. Yet Matthew remained part of her thoughts. She knew his flaws and knew, too, that he had a kind of sincerity she had rarely found elsewhere."], ["Matthew's investigation continued alongside his grief. The biological systems inside Organoprocessors appeared to depend on existing living processes. He came to believe that the official account of manufactured food concealed a growing shortage. What if humanity was consuming not only the visible forests of the past, but the last microscopic ecosystems on which its future depended?", "Matthew's work brought him closer to an alarming conclusion. Organoprocessors did not simply assemble meals out of inert elements. Their operation depended on living cellular processes, manipulated and redirected into the production of food and other materials."], ["This mattered because living systems could be depleted. If the supply of viable cells failed, a world that had forgotten agriculture might lose the very machines it trusted to replace nature. Matthew suspected that powerful people understood the problem and had chosen secrecy instead of change.", "He considered the surviving Wilderness Area. Its diversity was unlike anything left outside its walls. It could sustain a supply of biological material for industrial use—but only if somebody was taking that material. Such activity would be hidden from the citizens who believed the area was being preserved."], ["The idea seemed almost impossible to prove. Matthew decided that proof, not another argument, was what he needed.", "Chrissie found correspondence linking 247 Organoprocessors and unexplained production spikes that appeared to travel outward from the Wilderness Area. Matthew’s calculations suggested that global production was declining by roughly one percent a year. The system was using up its source, not replenishing it.", "Matthew resolved to enter the Wilderness Area. He knew it was restricted and watched. He planned carefully, relying on Chrissie to help him understand the surveillance systems without drawing attention to himself."], ["Before leaving, he went to Michelle. She was weary of his explanations and afraid he was once again chasing an idea that would consume him. When he told her he meant to go into the protected wilderness, she was horrified.", "He insisted that he was not asking her to follow him. He wanted her to know where he was going. But the danger, the secrecy and the possibility of never seeing him again changed the conversation. Despite their broken relationship, Michelle could not simply turn away."], ["Eventually they traveled together toward the Wilderness Area. Whatever remained unresolved between them, they were now approaching a place neither had truly experienced: a living forest in a world that had almost forgotten what one was.", "They reached a resort built into the immense wall surrounding the Wilderness Area. From its viewing platforms, visitors could glimpse vegetation and mountains beyond the boundary. The contrast was extraordinary. Behind them lay the managed, brown landscape of civilization. Ahead was green life."], ["Matthew kept his plans quiet. He distrusted the digital systems in the building and worried that even an apparently private room might be monitored. Michelle was excited by the view but uneasy about the secrecy.", "They moved from the safe, expensive perspective offered to tourists toward a hidden route beneath the boundary. With improvised tools and Chrissie's assistance, Matthew found a way through a drainage passage. The crossing was awkward and dangerous, but they emerged on the other side."], ["For the first time, Michelle stood among living plants and heard the sounds of animals without a screen or recording between them. The forest was not a display. It was a world of its own.", "They walked through trees, vines and thickening undergrowth. The forest changed with altitude and terrain. Insects moved through the leaf litter; birds called above them. Michelle saw things she had known only from books and documentaries. Some frightened her. Others filled her with wonder."], ["Matthew was overwhelmed by the variety of life. The forest seemed to offer a glimpse of what the planet had once been. But it also raised a painful question: if so much life still existed here, why was the rest of Earth being allowed to die?", "They saw a wasp dragging a paralyzed spider and argued gently about cruelty and nature. Matthew said the creature was doing what came naturally. Michelle could understand that and still feel sorry for the spider.", "They camped in the wilderness, sharing food and listening to the night. Their old differences did not vanish, but they were no longer speaking only about themselves. They were discovering the same place together."], ["Matthew hoped to find evidence of hidden extraction or mining within the protected area. He knew that surveillance technology might detect a direct attempt to control sophisticated systems, so he avoided drawing on Chrissie's full capabilities. The wilderness was enormous, and his clues were incomplete.", "They climbed ridges, followed streams and searched for signs that people had been working where no one was supposed to be. Michelle questioned the practicalities. Without a proper map, how would they find their way back? Without reliable communications, how could they call for help?"], ["Matthew believed he could retrace their route. His confidence was not always convincing. Still, the journey gave them moments of beauty that neither wanted to surrender. The forests grew denser. They reached views of valleys, cliffs and water that seemed impossible beside the exhausted cities beyond the wall.", "The farther they traveled, the greater the risk of being lost—and of finding exactly what Matthew feared."], ["In the wilderness, Matthew tried to explain the ideas that had kept him restless for so long. He believed society had made nearly everything into a commodity, forcing people to buy access to the things that once grew freely. Money and corporate power had become the measures of survival, while the living systems that made survival possible had been destroyed.", "Michelle listened, sometimes challenging him. She had seen the benefits of order, technology and work. She did not think all of those things were wrong. Yet the forest made his argument harder to dismiss. Here was life sustained through relationships more complex than any market calculation."], ["For Matthew, the wilderness suggested that a society built around shared needs rather than endless extraction might be possible. For Michelle, it suggested something simpler and more immediate: that life was precious, fragile and impossible to replace with a simulation.", "Their conversation did not settle the world's future. It brought them closer to understanding each other.", "As they traveled, Matthew and Michelle followed the old Duck Creek Road, saw King Parrots, heard frogs and insects, and experienced a living world neither had known firsthand. The trip briefly allowed them to speak to one another without the city’s expectations between them."], ["Their route led them to a waterfall and a deep pool. The sight delighted them. They swam in the cold water, laughed as the falling spray struck their skin and enjoyed a moment free from the pressure of the outside world.", "Michelle looked at Matthew with affection. She wondered aloud why she had met someone so strange and difficult. Then she admitted that she was glad she had. Matthew felt the possibility of a future between them but was afraid to speak too quickly and spoil it."], ["For a brief time, the journey seemed to offer everything they had lost: trust, tenderness and a world worth sharing. The forest was no longer only evidence in Matthew's investigation. It was a place where the two of them could simply be alive.", "Then Michelle noticed something beyond the vegetation: the edge of a building, partly hidden among the trees. The discovery brought Matthew's suspicions suddenly close to reality.", "They moved toward the structure. As Matthew climbed ahead, Michelle screamed. A brown snake had struck her leg, then struck again. Matthew turned and attacked the snake with a rock, but the damage had already been done."], ["Michelle weakened rapidly. Matthew knew the bite was serious and struggled to decide what to do. They were deep inside the forbidden wilderness, far from ordinary medical help. The beautiful isolation that had thrilled them now became a trap.", "He carried her toward the building they had seen, hoping to find someone with medicine or a way to summon assistance. His fear was no longer about being discovered. It was about losing Michelle before he could help her.", "The building, which had seemed like the proof he needed, became his only hope of saving the person he loved."], ["When Michelle was bitten by a brown snake, Matthew struck the snake with a rock. He carried her toward a building, desperate for help, but she died in his arms. The act of killing the snake later became the center of Orschlack’s accusation: in a moment of fear, Matthew had protected a human life by destroying another living thing.", "Inside, Matthew found screens showing an operation hidden within the Wilderness Area: trees being cut, animals taken and resources extracted. The evidence he had been searching for was in front of him."], ["An older man turned from the monitors. It was Douglas Orschlack, the powerful figure behind the Organoprocessors. Orschlack already knew Matthew's name. He admitted that Matthew had been watched and that the hidden activity was real.", "Matthew begged him to help Michelle. Orschlack said there was no antivenin available and that it was too late. He spoke of her death with a coldness Matthew could scarcely bear."], ["Then Orschlack explained the deeper crisis. Organoprocessors relied on living cellular ecosystems, and those systems were dying too. The wider ecocide had never truly stopped. The machinery feeding humanity was consuming the very biological foundations it needed to survive.", "Matthew had found his answer. It came at the worst possible cost.", "Douglas Orschlack admitted that the Organoprocessors depended on living material taken from the Wilderness Area. He had kept the system running, but could not prevent its eventual decline. His answer was not a rescue plan, only the continuation of a system that could not last."], ["Matthew's encounter with Orschlack turned dangerous. He fled the building and the people guarding it, carrying the shock of what had happened to Michelle. Pursuers came after him with a dog.", "The animal caught him and attacked, tearing his hand and injuring his leg. Matthew fought it off with a rock and staggered deeper into the forest. Blood soaked his improvised bandage. He was frightened, in pain and desperate to escape the men behind him."], ["He pushed through trees and across uneven ground until the sounds of pursuit faded. But safety was only another kind of danger. He no longer knew where he was. The forest he had admired became a maze of slopes and gullies, and every movement made his injuries worse.", "He tried to follow the land downhill, hoping water would lead him toward an exit. The hours passed. Hunger, exhaustion and pain stripped away the confidence that had brought him there.", "Pursued by men and dogs, Matthew was injured in his hand and leg. At last he had to leave Michelle’s body behind. He kissed her goodbye and fled into the forest, sick, exhausted, and barely able to keep moving."], ["Matthew spent the night cold and wounded. He drank from rock pools, stumbled along a creek and fought to remain conscious. The forest was full of life, but it could not protect him from infection, blood loss or the cold. The same wilderness that had seemed like a promise now held him without offering an easy way out.", "He thought of Michelle. He remembered her warmth and the future they had almost found again. The moon above the trees brought her to mind with painful clarity."], ["By the following day, his strength was failing. He fell, rose and fell again. At the edge of consciousness, he saw Michelle beside him, speaking gently and encouraging him onward. Whether this was memory, vision or something beyond his failing body, the moment gave him enough strength to try to stand.", "The novel ends with a brief, enigmatic scene involving Kim and a question about butterflies. It does not supply a conventional rescue or a simple explanation of everything that has happened. Its closing note remains deliberately unsettling, leaving the reader with life, loss and the fragile persistence of hope."], ["At the edge of collapse, Matthew seemed to hear Michelle urging him onward. He stood and tried to move again. The novel then returns to Kim, a seventeen-year-old girl in 1985, collecting butterflies in the mountains. As she rests beneath a tree, she hears footsteps and a voice offering her something. She asks whether it is butterflies. The final question—whether that is really what she wants—remains unanswered.", "Questions for Readers", "1. What did Michelle hope to find by leaving the Moon for Earth?", "2. How do Michelle and Matthew differ in their ideas about work, security, and freedom?", "3. Why is Matthew disturbed by the discovery of King Parrot DNA?"], ["4. What does Chrissie uncover about the Organoprocessors?", "5. Why is the Wilderness Area important to the survival of humanity?", "6. Why does Michelle decide to accompany Matthew despite their separation?", "7. How does their time in the forest change the way they see one another?", "8. What does Michelle’s death reveal about the danger of entering a living wilderness?", "9. How does Orschlack justify his choices, and do you agree with him?", "10. What might Matthew’s determination to continue mean at the end of his journey?", "11. What is the difference between keeping people alive and creating a sustainable world?"], ["12. How does the story contrast real living things with technological replicas?", "13. Is Matthew’s refusal to compromise a strength, a weakness, or both?", "14. What does the story suggest about the cost of convenience?", "15. Why do you think the novel ends with Kim in 1985 rather than with Matthew?", "16. What do you think the final unanswered question means?", "17. Which character’s choices did you understand best, and why?", "18. If you could change one decision made by a character, which would it be?"]];
function pageMarkup(index){
 if(index<0)return '<h2>The Forest of Life</h2><p>A Story Edition</p><p>Based on the novel by Alexander Scot McPhie</p><p>Private practice adaptation for author review.</p>';
 if(index>=storyPages.length)return '<h2>The End</h2><p>Thank you for reading.</p>';
 return storyPages[index].map(t=>'<p>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>').join('')+'<span class="folio">'+(index+1)+'</span>';
}
let isOpen=false,page=0,busy=false;
const left=document.getElementById('leftCopy');
const right=document.getElementById('rightCopy'),lf=document.getElementById('leafFrontCopy'),lb=document.getElementById('leafBackCopy');
function paint(){
 left.innerHTML=pageMarkup(page-1);
 right.innerHTML=pageMarkup(page);
 lf.innerHTML=pageMarkup(page);
 lb.innerHTML=pageMarkup(page+1);
 turnBtn.disabled=!isOpen||busy||page>=storyPages.length-1;
 turnBtn.textContent=page>=storyPages.length-1?'Finished':'Next page →';
 hint.textContent=isOpen?'Story page '+(page+1)+' of '+storyPages.length+' · The white pages should now be visible.':'Click Open hardcover to begin reading.';
}
function toggleCover(){
 if(busy)return;
 isOpen=!isOpen;
 book.classList.remove('settled','turning');
 if(!isOpen){page=0;leaf.classList.remove('flipped');}
 book.classList.toggle('open',isOpen);
 coverBtn.textContent=isOpen?'Close hardcover':'Open hardcover';
 if(isOpen)setTimeout(()=>{if(isOpen)book.classList.add('settled')},1800);
 paint();
}
coverBtn.addEventListener('click',toggleCover);
document.getElementById('frontBoard').addEventListener('click',()=>{if(!isOpen)toggleCover()});
document.getElementById('frontBoard').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!isOpen){e.preventDefault();toggleCover()}});
turnBtn.addEventListener('click',()=>{
 if(!isOpen||busy||page>=storyPages.length-1)return;
 busy=true;turnBtn.disabled=true;
 lf.innerHTML=pageMarkup(page);
 lb.innerHTML=pageMarkup(page+1);
 leaf.classList.remove('flipped');
 book.classList.add('turning');
 void leaf.offsetWidth;
 leaf.classList.add('flipped');
 setTimeout(()=>{
   page++;
   book.classList.remove('turning');
   leaf.style.transition='none';leaf.classList.remove('flipped');
   void leaf.offsetWidth;leaf.style.transition='';
   busy=false;paint();
 },1200);
});
document.getElementById('resetBtn').addEventListener('click',()=>{isOpen=false;page=0;busy=false;leaf.classList.remove('flipped');book.classList.remove('open','settled','turning');coverBtn.textContent='Open hardcover';paint()});
paint();
</script>
