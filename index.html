ion:column;align-items:center;justify-content:center;gap:15px}.title-page h1{font-size:clamp(25px,3.3vw,44px);font-weight:normal;margin:0}.turner{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;z-index:12;transition:transform .8s cubic-bezier(.22,.6,.2,1);pointer-events:none;display:none}.turner .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);border:1px solid #bfb09a;overflow:hidden}.turner .back{transform:rotateY(180deg)}.turner.flipping{display:block;transform:rotateY(-180deg)}.controls{display:flex;justify-content:center;align-items:center;gap:16px;padding:10px 12px 25px;font:13px Arial,sans-serif}.controls button{background:#244a40;color:#fff9eb;border:0;border-radius:25px;padding:12px 22px;cursor:pointer}.controls button:disabled{opacity:.4;cursor:not-allowed}.note{text-align:center;color:#74695d;font:11px Arial,sans-serif;padding:0 10px 14px}@media(max-width:650px){.stage{height:65vh;min-height:350px}.book{width:96vw;aspect-ratio:1.1}.paper{padding:12px;font-size:clamp(8px,1.7vw,11px);line-height:1.45}.cover{padding:8px;border-width:5px}.cover h2{font-size:24px}.cover p{font-size:11px}.title-page h1{font-size:20px}.title-page{gap:7px}.page-num{bottom:4px;font-size:8px}.controls{gap:10px}.controls button{padding:11px 15px}}
</style></head><body><header><div class="brand">LEAFORA LIVING BOOKS</div><h1>The Forest of Life</h1><p>Hardcover reading prototype · Author review copy</p></header><main class="stage"><div class="book" id="book"><div class="sheet left" id="left"></div><div class="sheet right" id="right"></div><div class="turner" id="turner"><div class="face front" id="turnFront"></div><div class="face back" id="turnBack"></div></div></div></main><div class="controls"><button id="prev">← Previous</button><span id="counter"></span><button id="next">Next →</button></div><div class="note">Use the buttons or keyboard arrows to turn pages. Practice edition; cover artwork is a placeholder.</div><script>
const pages=["<div class=\"title-page\"><span class=\"small\">LEAFORA LIVING BOOKS</span><h1>The Forest<br>of Life</h1><p>A Story Edition</p><p>Based on the novel by<br>Alexander Scot McPhie</p><span class=\"small\">Private prototype for author review</span></div>", "<p>From the window of her shuttle, Michelle Holland looked down at Earth. She had grown up in the Moon&#x27;s ordered colonies, where the air was clean and every movement was carefully managed. Earth was something else: a dark, cloud-bound world crowded with billions of people. She had come to Brisbane to begin a new job and, more importantly, to begin a life of her own.</p><p>The shuttle landed through threatening weather. On the ground, heat and humidity wrapped around her. She watched people rush through the aerospaceport, surrounded by talking computers, facial-recognition systems and machines that seemed to know her before she spoke. Michelle disliked the intrusion. She wanted to discover Earth for herself, not through the voice of her digital assistant, a &#x27;Betty.&#x27;</p><p>Outside the cities, there was little to discover. The living world had almost disappeared. Giant Rebreather towers kept the air breathable and tried to control the weather. Between the densely inhabited urban areas stretched dead land. Michelle knew the facts, but facts were not the same as seeing a planet whose forests were nearly gone.</p>", "<p>Michelle found temporary accommodation and made her way into Brisbane&#x27;s crowded streets. Every surface seemed occupied by advertising, technology or people. Food was plentiful, yet it came from Organoprocessors rather than farms. The world had built extraordinary systems to keep humanity alive after the collapse of natural ecosystems.</p><p>She began work at Sysdene, a company delivering public services and managing government housing. There she encountered the endless arithmetic of budgets, complaints, maintenance orders and people who needed help. She had hoped a new world would mean freedom. Instead, she found another set of rules, and a great many people who accepted those rules without asking why.</p><p>At work she noticed a technician named Matthew Finler. He seemed intelligent, distracted and unwilling to pretend that his job mattered to him. He offered to help her with technical problems, but there was something else in the way he spoke: a restless dissatisfaction with the world that everyone else appeared to take for granted.</p>", "<p>Matthew was good at his work. He understood hardware, software and the strange digital assistants that ran much of society. Yet he had grown tired of fixing one system after another without questioning the larger machine they served.</p><p>When Michelle learned that he was leaving his position, she was surprised. He did not have a secure new career waiting. He had some freelance work and enough savings to think for a while. That seemed reckless to her. To Matthew, remaining in a job he no longer believed in seemed worse.</p><p>They talked over lunch. Michelle was drawn to his curiosity, although she could not understand why he made life so difficult for himself. Matthew liked her directness and the fact that she had chosen to come to Earth despite its troubles. Their conversation was ordinary, but it left them both wanting another. Soon, the distance between a passing acquaintance and someone important began to narrow.</p>", "<p>Earth had not become barren in a single disaster. The collapse had spread through connected ecosystems, through soil and water, crops and forests, until the failure of one living process pushed another toward ruin. Technology had advanced at the same time. Disease could be treated, distant colonies established, and digital systems made ever more powerful. None of those achievements had stopped the loss of life beneath humanity&#x27;s feet.</p><p>Now the cities relied on Organoprocessors to manufacture food and other organic goods. Rebreathers handled the air. Governments and corporations controlled the systems on which everyone depended. Outside the protected zones, the land was largely lifeless.</p><p>Michelle was learning to live inside that arrangement. Matthew could not stop wondering how it had happened, or whether the answer was being hidden. For him, the question was not simply how to keep people alive today. It was what kind of future they could have if the last living systems continued to be consumed.</p>", "<p>Freelance work brought Matthew to an Organoprocessor installation linked to the industrial empire of Douglas Orschlack. The assignment seemed straightforward: diagnose a malfunction in an important data system. The site was heavily controlled, and its staff were unusually cautious about what he might see.</p><p>With the help of his digital assistant, Chrissie, Matthew traced the problem to unusual biological storage components. The equipment used living material in a way that made him uneasy. A suspected contamination and a hidden history of the storage system raised more questions than the repair order answered.</p><p>He completed the technical work, but he did not forget what he had found. Orschlack&#x27;s name was associated with the technologies that sustained civilization. If those technologies depended on something living, then the world&#x27;s most celebrated solution might have a weakness no one wanted to admit.</p><p>Matthew began to investigate quietly. His curiosity, once a vague rebellion against ordinary work, had acquired a dangerous direction.</p>", "<p>What disturbed him most was the trace of King Parrot DNA in the bacterial memory drives. King Parrots were supposed to be extinct. The trace suggested a connection between the industrial machinery and living creatures the world had been told were gone.</p><p>Michelle and Matthew kept finding reasons to see each other. He invited her to an old film, and she invited him to dinner. Their awkward conversations gave way to laughter, affection and a growing intimacy. Michelle loved the way he could be fascinated by a simple question; Matthew loved her warmth and her determination to make a life far from home.</p><p>But their differences remained. Michelle believed in work, plans and commitments. Matthew was searching for an idea large enough to justify changing his life. She wanted to know where they were going together. He struggled to explain where he was going alone.</p>", "<p>The city around them continued to run on artificial food, managed weather and machines that listened. Their private happiness seemed possible inside that world, but Matthew could not put aside the feeling that the world itself was wrong. Michelle sometimes wished he could simply be happy with what they had.</p><p>The relationship grew intense, and Michelle finally asked the question Matthew had been avoiding: did he love her? She knew her own answer. She loved him deeply. Matthew hesitated, tangled in feelings he had never properly understood and memories of another attachment.</p><p>His uncertainty hurt Michelle. For a time, they tried to work through it. She wanted honesty and a future she could recognize. He wanted to be truthful without promising something he feared he could not sustain. Neither could easily separate love from the demands each placed upon it.</p><p>Their arguments were not only about romance. Michelle wanted Matthew to act on his ideas instead of surrounding himself with notes and possibilities. Matthew believed that the world needed a more fundamental change than a stable job and a conventional life could offer.</p>", "<p>Even when they drew close again, the difference between their hopes waited beneath the surface.</p><p>There was one place on Earth that held the possibility of a different answer: the Wilderness Area, a protected region where plants and animals still survived. Its boundaries were guarded, its interior inaccessible to ordinary people. Most citizens could see it only through controlled images or from expensive viewing platforms.</p><p>For Matthew, the Wilderness Area became more than a symbol. He suspected that Orschlack&#x27;s Organoprocessors were not creating life from nothing. Their biological systems might require living cells that had to come from somewhere. The surviving wilderness offered a possible source.</p><p>If he was right, the public had been told an incomplete story about the technology that fed them. The forest might not be protected from exploitation at all. It might be the source of a hidden extraction industry.</p><p>Michelle understood the danger of pursuing such a suspicion. Matthew saw the danger of refusing to ask.</p>", "<p>Michelle&#x27;s career advanced. She became more confident in the busy institutional world of Sysdene, meeting colleagues and taking on responsibilities. Matthew moved in the opposite direction, spending more time alone with his research, his theories and Chrissie&#x27;s calculations.</p><p>The more he spoke about a different society, the more Michelle wondered whether there was room for her in it. He questioned money, corporate power and a world where people could obtain the necessities of life only by participating in systems they did not control. She did not dismiss all his concerns, but she needed a partner who could live in the present.</p><p>Their affection could not settle the disagreement. Michelle told him they wanted different things. Matthew argued that two people could follow their own paths and still meet in the middle. She was no longer sure such a middle existed.</p><p>They separated, painfully and without the certainty that either had stopped caring.</p>", "<p>Matthew tried to accept Michelle&#x27;s request for distance. It was harder than he expected. He watched her continue with work and friendships while his own life seemed to shrink around a single absence. At times he reached out, apologizing, insisting that love mattered more than his theories. Michelle listened, but she could not keep reopening the same wound.</p><p>Other people entered her life, and she attempted to move forward. Yet Matthew remained part of her thoughts. She knew his flaws and knew, too, that he had a kind of sincerity she had rarely found elsewhere.</p><p>Matthew&#x27;s investigation continued alongside his grief. The biological systems inside Organoprocessors appeared to depend on existing living processes. He came to believe that the official account of manufactured food concealed a growing shortage. What if humanity was consuming not only the visible forests of the past, but the last microscopic ecosystems on which its future depended?</p>", "<p>Matthew&#x27;s work brought him closer to an alarming conclusion. Organoprocessors did not simply assemble meals out of inert elements. Their operation depended on living cellular processes, manipulated and redirected into the production of food and other materials.</p><p>This mattered because living systems could be depleted. If the supply of viable cells failed, a world that had forgotten agriculture might lose the very machines it trusted to replace nature. Matthew suspected that powerful people understood the problem and had chosen secrecy instead of change.</p><p>He considered the surviving Wilderness Area. Its diversity was unlike anything left outside its walls. It could sustain a supply of biological material for industrial use—but only if somebody was taking that material. Such activity would be hidden from the citizens who believed the area was being preserved.</p><p>The idea seemed almost impossible to prove. Matthew decided that proof, not another argument, was what he needed.</p>", "<p>Chrissie found correspondence linking 247 Organoprocessors and unexplained production spikes that appeared to travel outward from the Wilderness Area. Matthew’s calculations suggested that global production was declining by roughly one percent a year. The system was using up its source, not replenishing it.</p><p>Matthew resolved to enter the Wilderness Area. He knew it was restricted and watched. He planned carefully, relying on Chrissie to help him understand the surveillance systems without drawing attention to himself.</p><p>Before leaving, he went to Michelle. She was weary of his explanations and afraid he was once again chasing an idea that would consume him. When he told her he meant to go into the protected wilderness, she was horrified.</p><p>He insisted that he was not asking her to follow him. He wanted her to know where he was going. But the danger, the secrecy and the possibility of never seeing him again changed the conversation. Despite their broken relationship, Michelle could not simply turn away.</p>", "<p>Eventually they traveled together toward the Wilderness Area. Whatever remained unresolved between them, they were now approaching a place neither had truly experienced: a living forest in a world that had almost forgotten what one was.</p><p>They reached a resort built into the immense wall surrounding the Wilderness Area. From its viewing platforms, visitors could glimpse vegetation and mountains beyond the boundary. The contrast was extraordinary. Behind them lay the managed, brown landscape of civilization. Ahead was green life.</p><p>Matthew kept his plans quiet. He distrusted the digital systems in the building and worried that even an apparently private room might be monitored. Michelle was excited by the view but uneasy about the secrecy.</p><p>They moved from the safe, expensive perspective offered to tourists toward a hidden route beneath the boundary. With improvised tools and Chrissie&#x27;s assistance, Matthew found a way through a drainage passage. The crossing was awkward and dangerous, but they emerged on the other side.</p>", "<p>For the first time, Michelle stood among living plants and heard the sounds of animals without a screen or recording between them. The forest was not a display. It was a world of its own.</p><p>They walked through trees, vines and thickening undergrowth. The forest changed with altitude and terrain. Insects moved through the leaf litter; birds called above them. Michelle saw things she had known only from books and documentaries. Some frightened her. Others filled her with wonder.</p><p>Matthew was overwhelmed by the variety of life. The forest seemed to offer a glimpse of what the planet had once been. But it also raised a painful question: if so much life still existed here, why was the rest of Earth being allowed to die?</p><p>They saw a wasp dragging a paralyzed spider and argued gently about cruelty and nature. Matthew said the creature was doing what came naturally. Michelle could understand that and still feel sorry for the spider.</p><p>They camped in the wilderness, sharing food and listening to the night. Their old differences did not vanish, but they were no longer speaking only about themselves. They were discovering the same place together.</p>", "<p>Matthew hoped to find evidence of hidden extraction or mining within the protected area. He knew that surveillance technology might detect a direct attempt to control sophisticated systems, so he avoided drawing on Chrissie&#x27;s full capabilities. The wilderness was enormous, and his clues were incomplete.</p><p>They climbed ridges, followed streams and searched for signs that people had been working where no one was supposed to be. Michelle questioned the practicalities. Without a proper map, how would they find their way back? Without reliable communications, how could they call for help?</p><p>Matthew believed he could retrace their route. His confidence was not always convincing. Still, the journey gave them moments of beauty that neither wanted to surrender. The forests grew denser. They reached views of valleys, cliffs and water that seemed impossible beside the exhausted cities beyond the wall.</p><p>The farther they traveled, the greater the risk of being lost—and of finding exactly what Matthew feared.</p>", "<p>In the wilderness, Matthew tried to explain the ideas that had kept him restless for so long. He believed society had made nearly everything into a commodity, forcing people to buy access to the things that once grew freely. Money and corporate power had become the measures of survival, while the living systems that made survival possible had been destroyed.</p><p>Michelle listened, sometimes challenging him. She had seen the benefits of order, technology and work. She did not think all of those things were wrong. Yet the forest made his argument harder to dismiss. Here was life sustained through relationships more complex than any market calculation.</p><p>For Matthew, the wilderness suggested that a society built around shared needs rather than endless extraction might be possible. For Michelle, it suggested something simpler and more immediate: that life was precious, fragile and impossible to replace with a simulation.</p><p>Their conversation did not settle the world&#x27;s future. It brought them closer to understanding each other.</p>", "<p>As they traveled, Matthew and Michelle followed the old Duck Creek Road, saw King Parrots, heard frogs and insects, and experienced a living world neither had known firsthand. The trip briefly allowed them to speak to one another without the city’s expectations between them.</p><p>Their route led them to a waterfall and a deep pool. The sight delighted them. They swam in the cold water, laughed as the falling spray struck their skin and enjoyed a moment free from the pressure of the outside world.</p><p>Michelle looked at Matthew with affection. She wondered aloud why she had met someone so strange and difficult. Then she admitted that she was glad she had. Matthew felt the possibility of a future between them but was afraid to speak too quickly and spoil it.</p><p>For a brief time, the journey seemed to offer everything they had lost: trust, tenderness and a world worth sharing. The forest was no longer only evidence in Matthew&#x27;s investigation. It was a place where the two of them could simply be alive.</p>", "<p>Then Michelle noticed something beyond the vegetation: the edge of a building, partly hidden among the trees. The discovery brought Matthew&#x27;s suspicions suddenly close to reality.</p><p>They moved toward the structure. As Matthew climbed ahead, Michelle screamed. A brown snake had struck her leg, then struck again. Matthew turned and attacked the snake with a rock, but the damage had already been done.</p><p>Michelle weakened rapidly. Matthew knew the bite was serious and struggled to decide what to do. They were deep inside the forbidden wilderness, far from ordinary medical help. The beautiful isolation that had thrilled them now became a trap.</p><p>He carried her toward the building they had seen, hoping to find someone with medicine or a way to summon assistance. His fear was no longer about being discovered. It was about losing Michelle before he could help her.</p><p>The building, which had seemed like the proof he needed, became his only hope of saving the person he loved.</p>", "<p>When Michelle was bitten by a brown snake, Matthew struck the snake with a rock. He carried her toward a building, desperate for help, but she died in his arms. The act of killing the snake later became the center of Orschlack’s accusation: in a moment of fear, Matthew had protected a human life by destroying another living thing.</p><p>Inside, Matthew found screens showing an operation hidden within the Wilderness Area: trees being cut, animals taken and resources extracted. The evidence he had been searching for was in front of him.</p><p>An older man turned from the monitors. It was Douglas Orschlack, the powerful figure behind the Organoprocessors. Orschlack already knew Matthew&#x27;s name. He admitted that Matthew had been watched and that the hidden activity was real.</p><p>Matthew begged him to help Michelle. Orschlack said there was no antivenin available and that it was too late. He spoke of her death with a coldness Matthew could scarcely bear.</p>", "<p>Then Orschlack explained the deeper crisis. Organoprocessors relied on living cellular ecosystems, and those systems were dying too. The wider ecocide had never truly stopped. The machinery feeding humanity was consuming the very biological foundations it needed to survive.</p><p>Matthew had found his answer. It came at the worst possible cost.</p><p>Douglas Orschlack admitted that the Organoprocessors depended on living material taken from the Wilderness Area. He had kept the system running, but could not prevent its eventual decline. His answer was not a rescue plan, only the continuation of a system that could not last.</p><p>Matthew&#x27;s encounter with Orschlack turned dangerous. He fled the building and the people guarding it, carrying the shock of what had happened to Michelle. Pursuers came after him with a dog.</p><p>The animal caught him and attacked, tearing his hand and injuring his leg. Matthew fought it off with a rock and staggered deeper into the forest. Blood soaked his improvised bandage. He was frightened, in pain and desperate to escape the men behind him.</p>", "<p>He pushed through trees and across uneven ground until the sounds of pursuit faded. But safety was only another kind of danger. He no longer knew where he was. The forest he had admired became a maze of slopes and gullies, and every movement made his injuries worse.</p><p>He tried to follow the land downhill, hoping water would lead him toward an exit. The hours passed. Hunger, exhaustion and pain stripped away the confidence that had brought him there.</p><p>Pursued by men and dogs, Matthew was injured in his hand and leg. At last he had to leave Michelle’s body behind. He kissed her goodbye and fled into the forest, sick, exhausted, and barely able to keep moving.</p><p>Matthew spent the night cold and wounded. He drank from rock pools, stumbled along a creek and fought to remain conscious. The forest was full of life, but it could not protect him from infection, blood loss or the cold. The same wilderness that had seemed like a promise now held him without offering an easy way out.</p><p>He thought of Michelle. He remembered her warmth and the future they had almost found again. The moon above the trees brought her to mind with painful clarity.</p>", "<p>By the following day, his strength was failing. He fell, rose and fell again. At the edge of consciousness, he saw Michelle beside him, speaking gently and encouraging him onward. Whether this was memory, vision or something beyond his failing body, the moment gave him enough strength to try to stand.</p><p>The novel ends with a brief, enigmatic scene involving Kim and a question about butterflies. It does not supply a conventional rescue or a simple explanation of everything that has happened. Its closing note remains deliberately unsettling, leaving the reader with life, loss and the fragile persistence of hope.</p><p>At the edge of collapse, Matthew seemed to hear Michelle urging him onward. He stood and tried to move again. The novel then returns to Kim, a seventeen-year-old girl in 1985, collecting butterflies in the mountains. As she rests beneath a tree, she hears footsteps and a voice offering her something. She asks whether it is butterflies. The final question—whether that is really what she wants—remains unanswered.</p>", "<h2>Reader Reflections</h2><p>What did Michelle hope to find on Earth?</p><p>How did Matthew’s discoveries challenge the world he lived in?</p><p>What does the ending suggest about humanity’s relationship with nature?</p><p>Which choice would you have made differently?</p>"];

function cover(back=false){return `<div class="cover"><span class="small">LEAFORA LIVING BOOKS</span><h2>${back?'The End':'The Forest<br>of Life'}</h2><p>${back?'A shorter reading experience':'A Story Edition'}</p><span class="small">Alexander Scot McPhie</span></div>`}
function page(n){if(n<0)return cover();if(n>=pages.length)return cover(true);return `<div class="paper">${pages[n]}</div><div class="page-num">${n+1}</div>`}
function draw(){left.innerHTML=position<0?'<div class="paper"></div>':page(position);right.innerHTML=position<0?cover():page(position+1);document.getElementById('counter').textContent=position<0?'Front cover':position>=pages.length?'Back cover':`Pages ${position+1}–${Math.min(position+2,pages.length)} of ${pages.length}`;document.getElementById('prev').disabled=position<0;document.getElementById('next').disabled=position>=pages.length;}
function move(direction){if(busy)return;let target=position+direction*2;if(direction>0&&position<0)target=0;if(direction<0&&position===0)target=-1;if(target< -1||target>pages.length+1)return;busy=true;const front=document.getElementById('turnFront'),back=document.getElementById('turnBack');if(direction>0){front.innerHTML=right.innerHTML;back.innerHTML=page(Math.min(target,pages.length));turner.style.left='50%';turner.style.transformOrigin='left center';turner.style.transform='rotateY(0deg)';}else{front.innerHTML=left.innerHTML;back.innerHTML=page(Math.max(-1,target+1));turner.style.left='0';turner.style.transformOrigin='right center';turner.style.transform='rotateY(0deg)';}turner.style.display='block';requestAnimationFrame(()=>requestAnimationFrame(()=>{turner.style.transform=`rotateY(${direction>0?-180:180}deg)`}));setTimeout(()=>{position=target;turner.style.display='none';turner.style.transform='rotateY(0deg)';draw();busy=false},850)}

</script></body></html>
